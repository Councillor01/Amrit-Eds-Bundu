<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EDS Employee Verification</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #17365d;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .details {
            text-align: left;
            background: #f7f9fb;
            border-radius: 12px;
            padding: 20px;
        }

        .row {
            padding: 13px 0;
            border-bottom: 1px solid #ddd;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 13px;
            font-weight: bold;
            color: #666;
        }

        .value {
            font-size: 19px;
            font-weight: bold;
            margin-top: 5px;
            color: #222;
        }

        .verified {
            margin-top: 25px;
            padding: 12px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>EDS EMPLOYEE</h1>
        <div class="subtitle">Employee Verification</div>

        <div class="details">

            <div class="row">
                <div class="label">NAME</div>
                <div class="value">AMRIT ORAON</div>
            </div>

            <div class="row">
                <div class="label">EMPLOYEE ID</div>
                <div class="value">EDS0157</div>
            </div>

            <div class="row">
                <div class="label">DESIGNATION</div>
                <div class="value">PLACEMENT COORDINATOR</div>
            </div>

            <div class="row">
                <div class="label">ORGANIZATION / LOCATION</div>
                <div class="value">EDS BUNDU</div>
            </div>

        </div>

        <div class="verified">
            ✓ Employee Details Verified
        </div>

    </div>

</body>
</html>
